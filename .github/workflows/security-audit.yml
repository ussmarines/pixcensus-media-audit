name: Manual repository security audit

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Audit depth
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
      enforcement:
        description: Result handling
        required: true
        default: report
        type: choice
        options:
          - report
          - block

permissions:
  contents: read

concurrency:
  group: manual-security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare reports
        run: mkdir -p .security-reports

      - name: Identity and tracked-file guard
        id: identity_guard
        continue-on-error: true
        env:
          AUDIT_PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          args=(--report .security-reports/identity-guard.json)
          if [[ "$AUDIT_PROFILE" == "full" ]]; then
            args+=(--history)
          fi
          python3 .github/scripts/security_guard.py "${args[@]}"

      - name: Install verified Opengrep 1.22.0
        shell: bash
        run: |
          binary="opengrep_manylinux_x86"
          curl --fail --location --silent --show-error \
            "https://github.com/opengrep/opengrep/releases/download/v1.22.0/$binary" \
            --output "$binary"
          echo "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319  $binary" | sha256sum --check --strict
          install -m 0755 "$binary" "$RUNNER_TEMP/opengrep"

      - name: Run project Opengrep rules
        id: opengrep
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/opengrep" scan \
            --config .security/opengrep/project-security.yml \
            --json-output .security-reports/opengrep.json \
            --error \
            --exclude vendor \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            .

      - name: Install verified Trivy 0.70.0
        shell: bash
        run: |
          set -euo pipefail
          version="0.70.0"
          checksums="trivy_${version}_checksums.txt"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          curl --fail --location --silent --show-error "$base/$checksums" --output "$checksums"
          echo "c45281240bb9211ea9e830fc0bf5cf8acf7c0ca830feb64ac8a0aa932c5c92d9  $checksums" | sha256sum --check --strict
          archive="$(awk '$2 ~ /Linux-64bit\.tar\.gz$/ {print $2; exit}' "$checksums")"
          test -n "$archive"
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          grep "  $archive$" "$checksums" | sha256sum --check --strict
          tar -xzf "$archive" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"

      - name: Scan dependencies and configuration with Trivy
        id: trivy
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" filesystem \
            --scanners vuln,misconfig \
            --include-dev-deps \
            --severity MEDIUM,HIGH,CRITICAL \
            --format json \
            --output .security-reports/trivy.json \
            --exit-code 1 \
            .

      - name: Generate CycloneDX SBOM
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" filesystem \
            --scanners vuln \
            --include-dev-deps \
            --format cyclonedx \
            --output .security-reports/sbom.cdx.json \
            .

      - name: Audit project dependencies
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          if [[ -f package-lock.json ]]; then
            npm audit --audit-level=moderate --json > .security-reports/npm-audit.json || failed=1
          fi
          if [[ -f composer.lock ]]; then
            composer audit --locked --format=json > .security-reports/composer-audit.json || failed=1
          fi
          exit "$failed"

      - name: Install verified zizmor 1.26.1
        shell: bash
        run: |
          set -euo pipefail
          version="1.26.1"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/zizmorcore/zizmor/releases/download/v${version}"

          curl --fail --location --silent --show-error \
            "$base/$archive" \
            --output "$archive"

          echo "8556289a64e7aaf2400cd516f61a471aa91c5902cc56ad96a82fd12f90c2ef73  $archive" \
            | sha256sum --check --strict

          binary_path="$(tar -tzf "$archive" | awk '/(^|\/)zizmor$/ { print; exit }')"
          test -n "$binary_path"

          tar -xzf "$archive" "$binary_path"
          install -m 0755 "$binary_path" "$RUNNER_TEMP/zizmor"

      - name: Audit GitHub Actions with safe offline zizmor 1.26.1
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/zizmor" --offline --format json . > .security-reports/zizmor.json

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-security-${{ github.run_id }}
          path: .security-reports/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Enforce selected policy
        if: always()
        env:
          IDENTITY: ${{ steps.identity_guard.outcome }}
          OPENGREP: ${{ steps.opengrep.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          DEPENDENCIES: ${{ steps.dependency_audit.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
          ENFORCEMENT: ${{ inputs.enforcement }}
        shell: bash
        run: |
          failed=0
          for outcome in "$IDENTITY" "$OPENGREP" "$TRIVY" "$DEPENDENCIES" "$ZIZMOR"; do
            [[ "$outcome" == "success" ]] || failed=1
          done
          if [[ "$ENFORCEMENT" == "block" ]]; then
            exit "$failed"
          fi
          exit 0

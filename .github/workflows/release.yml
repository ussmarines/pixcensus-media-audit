name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release to deploy to WordPress.org
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-attest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/validate-release-tag.mjs "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run audit:npm -- --level=high
      - run: npm run validate:metadata
      - run: npm run validate:config
      - run: npm run validate:branding
      - run: npm run build:zip
      - run: npx wp-env start --config .wp-env.wp71-package.json
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp core version
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp plugin install /var/www/html/pixcensus-ci-source/dist/pixcensus-media-audit.zip --activate
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp plugin is-active pixcensus-media-audit
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp eval-file /var/www/html/pixcensus-ci-source/tests/integration/ajax-setup.php
      - run: npm run test:ajax
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp eval-file /var/www/html/pixcensus-ci-source/tests/integration/smoke.php
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp plugin install plugin-check -- --version=2.0.0 --activate
      - run: npx wp-env run cli --config .wp-env.wp71-package.json wp plugin check pixcensus-media-audit
      - name: Stop WordPress
        if: always()
        run: npx wp-env stop --config .wp-env.wp71-package.json || true
      - name: Attest tested ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pixcensus-media-audit.zip
      - name: Upload tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/pixcensus-media-audit.zip
            dist/pixcensus-media-audit.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  wordpress-org:
    if: >-
      always() && !cancelled() &&
      (needs.build-test-attest.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build-test-attest.result == 'skipped'))
    needs: build-test-attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      SVN_URL: https://plugins.svn.wordpress.org/pixcensus-media-audit
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Download tested release files
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Retrieve attested published release for SVN retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir release --pattern pixcensus-media-audit.zip --pattern pixcensus-media-audit.zip.sha256
          gh attestation verify release/pixcensus-media-audit.zip --repo "$GITHUB_REPOSITORY" --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$(git rev-parse HEAD)" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Verify tested package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict pixcensus-media-audit.zip.sha256
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import zipfile

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          version = tag[1:]
          target = Path('release/extracted')
          with zipfile.ZipFile('release/pixcensus-media-audit.zip') as archive:
              names = archive.namelist()
              if not names or any(not name.startswith('pixcensus-media-audit/') for name in names):
                  raise SystemExit('Release ZIP has an unexpected root.')
              archive.extractall(target)
          root = target / 'pixcensus-media-audit'
          main = (root / 'pixcensus-media-audit.php').read_text(encoding='utf-8')
          readme = (root / 'readme.txt').read_text(encoding='utf-8')
          if not re.search(rf'^\s*\*\s*Version:\s*{re.escape(version)}\s*$', main, re.M):
              raise SystemExit('Plugin header version does not match the tag.')
          if not re.search(rf'^Stable tag:\s*{re.escape(version)}\s*$', readme, re.M):
              raise SystemExit('Stable tag does not match the release tag.')
          source_readme = Path('readme.txt').read_text(encoding='utf-8')
          source_tested = re.search(r'^Tested up to:\s*(\d+\.\d+(?:\.\d+)?)\s*$', source_readme, re.M)
          if not source_tested or not re.search(r'^Tested up to:\s*' + re.escape(source_tested.group(1)) + r'\s*$', readme, re.M):
              raise SystemExit('WordPress.org Tested up to differs from the exact release source.')
          PY
      - name: Install Subversion client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes subversion
          svn --version --quiet
      - name: Read directory screenshots from the reviewed main revision for manual publication
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: directory-source
          sparse-checkout: .wordpress-org
          persist-credentials: false
      - name: Prepare strict WordPress.org SVN delta
        id: svn_prepare
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          svn checkout --quiet "$SVN_URL" svn-work

          asset_source=.wordpress-org
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            asset_source=directory-source/.wordpress-org
          fi
          assets=(assets/screenshot-1.png assets/screenshot-2.png)
          cp "$asset_source"/screenshot-{1,2}.png svn-work/assets/
          (cd svn-work && svn add --force "${assets[@]}" >/dev/null && svn propset svn:mime-type image/png "${assets[@]}" >/dev/null)
          if [ -d "svn-work/tags/$VERSION" ]; then
            if ! diff -qr --exclude='.svn' release/extracted/pixcensus-media-audit "svn-work/tags/$VERSION"; then
              echo "Existing WordPress.org tag $VERSION differs from the tested ZIP; refusing to continue." >&2
              exit 1
            fi
            echo "WordPress.org tag $VERSION already contains the exact tested package; treating this as an idempotent rerun."
            if [[ -n "$(cd svn-work && svn status "${assets[@]}")" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          mkdir -p svn-work/trunk svn-work/tags
          rsync -a --delete --exclude='.svn' release/extracted/pixcensus-media-audit/ svn-work/trunk/
          cd svn-work
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET

          xml = subprocess.check_output(['svn', 'status', '--xml'], text=True)
          root = ET.fromstring(xml)
          missing = []
          for entry in root.findall('.//entry'):
              status = entry.find('wc-status')
              if status is not None and status.attrib.get('item') == 'missing':
                  missing.append(entry.attrib['path'])
          for path in missing:
              subprocess.check_call(['svn', 'delete', '--force', path])
          PY
          svn add trunk --force >/dev/null
          svn copy trunk "tags/$VERSION" >/dev/null
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          version = os.environ['RELEASE_TAG'][1:]
          xml = subprocess.check_output(['svn', 'status', '--xml'], text=True)
          root = ET.fromstring(xml)
          changed = []
          for entry in root.findall('.//entry'):
              status = entry.find('wc-status')
              if status is None or status.attrib.get('item') == 'normal':
                  continue
              changed.append(str(PurePosixPath(entry.attrib['path'].replace('\\', '/'))))
          unexpected = [path for path in changed if not (path in {'assets/screenshot-1.png', 'assets/screenshot-2.png'} or path == 'trunk' or path.startswith('trunk/') or path == f'tags/{version}' or path.startswith(f'tags/{version}/'))]
          if unexpected:
              raise SystemExit(f'Unexpected SVN changes: {unexpected}')
          if not changed:
              raise SystemExit('No SVN changes prepared for the release.')
          print('Approved SVN paths:')
          for path in changed:
              print(path)
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish tested ZIP contents to WordPress.org
        if: steps.svn_prepare.outputs.changed == 'true'
        env:
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WPORG_SVN_PASSWORD"
          VERSION="${RELEASE_TAG#v}"
          cd svn-work
          svn commit <<< "$WPORG_SVN_PASSWORD" \
            --username ussmarines \
            --password-from-stdin \
            --non-interactive \
            --no-auth-cache \
            -m "Publish PixCensus — Media Usage Audit $VERSION"

  publish:
    if: github.event_name == 'push'
    needs:
      - build-test-attest
      - wordpress-org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check --strict pixcensus-media-audit.zip.sha256
          gh attestation verify pixcensus-media-audit.zip --repo "$GITHUB_REPOSITORY"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "PixCensus — Media Usage Audit ${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            release/pixcensus-media-audit.zip \
            release/pixcensus-media-audit.zip.sha256 \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

name: Manual secret and identity guard

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Scan depth
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
      enforcement:
        description: Result handling
        required: true
        default: report
        type: choice
        options:
          - report
          - block

permissions:
  contents: read

concurrency:
  group: manual-secret-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare reports
        run: mkdir -p .security-reports

      - name: Run redacted identity guard
        id: identity
        continue-on-error: true
        env:
          PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          args=(--report .security-reports/identity-guard.json)
          if [[ "$PROFILE" == "full" ]]; then
            args+=(--history)
          fi
          python3 .github/scripts/security_guard.py "${args[@]}"

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Run redacted Gitleaks scan
        id: gitleaks
        continue-on-error: true
        env:
          PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          if [[ "$PROFILE" == "full" ]]; then
            "$RUNNER_TEMP/gitleaks" git . \
              --log-opts="--all" \
              --redact=100 \
              --exit-code=2 \
              --report-format=json \
              --report-path=.security-reports/gitleaks.json
          else
            "$RUNNER_TEMP/gitleaks" dir . \
              --redact=100 \
              --exit-code=2 \
              --report-format=json \
              --report-path=.security-reports/gitleaks.json
          fi

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-identity-reports-${{ github.run_id }}
          path: .security-reports/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Enforce selected policy
        if: always()
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          ENFORCEMENT: ${{ inputs.enforcement }}
        shell: bash
        run: |
          failed=0
          [[ "$IDENTITY" == "success" ]] || failed=1
          [[ "$GITLEAKS" == "success" ]] || failed=1
          if [[ "$ENFORCEMENT" == "block" ]]; then
            exit "$failed"
          fi
          exit 0

name: QA

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm run actionlint

  security-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run security guard unit tests
        run: python3 -m unittest discover -s tests/security -p 'test_*.py'
      - name: Verify tracked tree and full history
        run: python3 .github/scripts/security_guard.py --history

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run safe offline zizmor 1.26.1
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            "zizmor==1.26.1"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline .

  qa:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict --no-interaction
      - if: matrix.php == '7.4'
        run: composer audit --locked --no-interaction
      - run: composer analyse
      - run: composer test
      - run: npm run test:property
      - if: matrix.php == '7.4'
        run: composer lint
      - run: php -l pixcensus-media-audit.php
      - run: find includes views tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l uninstall.php
      - run: node --check assets/admin.js
      - run: npm run validate:metadata
      - run: npm run validate:config
      - run: npm run validate:branding
      - if: matrix.php == '7.4'
        run: npm run build:zip

  wordpress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:config
      - run: npm run validate:branding
      - run: npm run build:zip
      - run: npx wp-env start
      - run: npx wp-env run cli wp plugin deactivate pixcensus-media-audit
      - run: npx wp-env run cli wp plugin install /var/www/html/wp-content/plugins/pixcensus-media-audit/dist/pixcensus-media-audit.zip --force --activate
      - run: npx wp-env run cli wp plugin is-active pixcensus-media-audit
      - run: npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/pixcensus-media-audit/tests/integration/ajax-setup.php
      - run: npm run test:ajax
      - run: npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/pixcensus-media-audit/tests/integration/smoke.php
      - run: npx wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
      - run: npx wp-env run cli wp plugin check pixcensus-media-audit
      - run: npx wp-env run cli wp i18n make-pot /var/www/html/wp-content/plugins/pixcensus-media-audit /var/www/html/wp-content/plugins/pixcensus-media-audit/languages/pixcensus-media-audit.pot --domain=pixcensus-media-audit --exclude=.agents,docs,tests,vendor,node_modules,scripts,dist --headers='{"POT-Creation-Date":"2026-08-05T17:30:00+00:00","Report-Msgid-Bugs-To":"https://github.com/ussmarines/pixcensus-media-audit/issues"}'
      - run: git diff --exit-code -- languages/pixcensus-media-audit.pot
      - if: always()
        continue-on-error: true
        run: npx wp-env stop

  wordpress-59:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:zip
      - run: npx wp-env start --config .wp-env.wp59.json
      - run: npx wp-env run cli --config .wp-env.wp59.json wp plugin deactivate pixcensus-media-audit
      - run: npx wp-env run cli --config .wp-env.wp59.json wp plugin install /var/www/html/wp-content/plugins/pixcensus-media-audit/dist/pixcensus-media-audit.zip --force --activate
      - run: npx wp-env run cli --config .wp-env.wp59.json wp core version
      - run: npx wp-env run cli --config .wp-env.wp59.json wp plugin is-active pixcensus-media-audit
      - run: npx wp-env run cli --config .wp-env.wp59.json wp eval-file /var/www/html/wp-content/plugins/pixcensus-media-audit/tests/integration/smoke.php
      - if: always()
        continue-on-error: true
        run: npx wp-env stop --config .wp-env.wp59.json

  wordpress-multisite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:zip
      - run: npx wp-env start --config .wp-env.multisite.json
      - run: npx wp-env run cli --config .wp-env.multisite.json wp plugin deactivate pixcensus-media-audit
      - run: npx wp-env run cli --config .wp-env.multisite.json wp core multisite-convert --title='PixCensus Network'
      - run: npx wp-env run cli --config .wp-env.multisite.json wp site create --slug=secondary --title='Secondary site' --email=secondary@example.test
      - run: npx wp-env run cli --config .wp-env.multisite.json wp plugin install /var/www/html/wp-content/plugins/pixcensus-media-audit/dist/pixcensus-media-audit.zip --force --activate-network
      - run: npx wp-env run cli --config .wp-env.multisite.json wp plugin is-active pixcensus-media-audit --network
      - run: npx wp-env run cli --config .wp-env.multisite.json wp eval-file /var/www/html/wp-content/plugins/pixcensus-media-audit/tests/integration/multisite-smoke.php
      - if: always()
        continue-on-error: true
        run: npx wp-env stop --config .wp-env.multisite.json
